# Minibench — pre-merge CI.
#
# cargo build + test, then the regression gate (`minibench diff baseline
# current`): fail the build when a state variable regressed vs the committed
# baseline. This closes the loop the workbench exists to close — the harness
# can say a run is *worse*, not merely *different*.
#
# Linux, cargo only. The SwiftUI app is gated by the local `bb pre-commit`
# (`swift build`); CI on Linux can't build a macOS app.
#
# Every dependency is public, so a plain checkout builds: no App token, no
# SSH -> HTTPS rewrite, no .cargo/config. Fork pull requests get the same
# signal as branches, which is the point of the repo being open.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: cargo test + regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Babashka
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          bb: latest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          # ~/.cargo/git is cacheable again: with no token rewritten into the
          # checkouts' remote URLs, there is nothing secret to persist.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build + test
        run: cargo test --workspace --all-targets

      - name: Regression gate
        run: bb regression-gate

      - name: Evidence validation gate
        run: bb validate-gate
