[workspace]
members = ["crates/kernel", "crates/data-plane", "crates/cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
authors = ["Christopher Lester <christopher@miniforge.ai>"]

# Centralized per miniforge-standards languages/rust (230). Safety core
# now; pedantic / unwrap_used / missing_docs tightening tracked as a
# follow-up (would add doc/test churn beyond this slice).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
async-trait = "0.1"
tower = { version = "0.4", features = ["util"] }

# The public seam, pinned to a published git rev over HTTPS — no
# credentials, no sibling checkout, no cargo config. Bump the rev to
# adopt upstream changes.
miniforge-app-foundation-contracts = { git = "https://github.com/miniforge-ai/miniforge-app-foundation.git", rev = "7ce4a41932a2ea0036d8741fe69a661c270cd6af" }
miniforge-app-foundation-data-plane = { git = "https://github.com/miniforge-ai/miniforge-app-foundation.git", rev = "7ce4a41932a2ea0036d8741fe69a661c270cd6af" }
workbench-contract = { git = "https://github.com/miniforge-ai/miniforge-app-foundation.git", rev = "7ce4a41932a2ea0036d8741fe69a661c270cd6af" }
minibench-kernel = { path = "crates/kernel" }
