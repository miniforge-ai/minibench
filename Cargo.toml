[workspace]
members = ["crates/kernel", "crates/data-plane", "crates/cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
authors = ["Christopher Lester <christopher@miniforge.ai>"]

# Centralized per miniforge-standards languages/rust (230). Safety core
# now; pedantic / unwrap_used / missing_docs tightening tracked as a
# follow-up (would add doc/test churn beyond this slice).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
async-trait = "0.1"
tower = { version = "0.4", features = ["util"] }

# Sibling repos pinned to published git revs — self-contained, no sibling
# checkout required. .cargo/config sets net.git-fetch-with-cli for private
# SSH fetch. Bump the revs to adopt upstream changes.
thesium-app-foundation-contracts = { git = "ssh://git@github.com/miniforge-ai/thesium-app-foundation.git", rev = "20eaee2621694964a780282b5ee35ad496fb84d1" }
thesium-app-foundation-data-plane = { git = "ssh://git@github.com/miniforge-ai/thesium-app-foundation.git", rev = "20eaee2621694964a780282b5ee35ad496fb84d1" }
workbench-contract = { git = "ssh://git@github.com/miniforge-ai/workbench-contract.git", rev = "5212f32ed9bdbfbc982e9ff746352c2f190d8e12" }
minibench-kernel = { path = "crates/kernel" }
